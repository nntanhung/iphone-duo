<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Duo · Fold Preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <div id="viewport" aria-label="iPhone Duo 3D model. Drag to rotate, scroll to zoom."></div>
    <a class="github-link" href="https://github.com/jadon7/iphone-duo" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144 0.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
    </a>
    <div class="control-dock">
      <aside class="screen-panel" aria-label="Screen UI">
        <div class="panel-heading"><h2>Screen UI</h2></div>
        <div class="ui-themes" role="tablist" aria-label="Screen UI type">
          <button role="tab" data-ui-theme="wallpaper" aria-selected="true">Wallpaper</button>
          <button role="tab" data-ui-theme="launcher" aria-selected="false">Launcher</button>
          <button role="tab" data-ui-theme="custom" aria-selected="false">Custom</button>
        </div>
        <div id="custom-upload-panel" class="custom-upload-panel" hidden>
          <button id="upload-single" type="button" class="upload-option">Single image<span>Use one image on both screens</span></button>
          <div class="separate-upload-group">
            <button id="upload-outer" type="button" class="upload-option">Outer screen<span>Upload outer image</span></button>
            <button id="upload-inner" type="button" class="upload-option">Inner screen<span>Upload inner image</span></button>
          </div>
          <p class="upload-hint"><strong>Recommended:</strong> inner <b>1600 × 1125 px</b> · outer <b>775 × 1125 px</b>. If only one separate image is uploaded, the other screen keeps its Wallpaper image.</p>
        </div>
        <input id="ui-upload-single" type="file" accept="image/*" hidden>
        <input id="ui-upload-inner" type="file" accept="image/*" hidden>
        <input id="ui-upload-outer" type="file" accept="image/*" hidden>
      </aside>
      <section class="controls" aria-label="Fold animation controls">
        <button id="play" class="play" aria-label="Play animation" disabled><svg id="pause-icon" viewBox="0 0 24 24" hidden><path d="M8 6v12M16 6v12"/></svg><svg id="play-icon" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg></button>
        <input id="angle" aria-label="Fold progress" type="range" min="0" max="180" value="180" step="0.1" disabled>
        <button id="export-video" class="export-video" type="button" disabled>Export Video</button>
        <button id="toggle-controls" class="hide-controls" type="button" aria-label="Hide Controls">Hide Controls</button>
      </section>
    </div>
    <button id="show-controls" class="show-controls" type="button" aria-label="Show Controls">Show Controls</button>
  </main>
  <script type="module" src="./main.js"></script>
  <script>
    (() => {
      const main = document.querySelector('main');
      const hideButton = document.querySelector('#toggle-controls');
      const showButton = document.querySelector('#show-controls');
      const dock = document.querySelector('.control-dock');
      const play = document.querySelector('#play');
      const angle = document.querySelector('#angle');
      const exportButton = document.querySelector('#export-video');
      const viewport = document.querySelector('#viewport');

      hideButton.addEventListener('click', () => {
        main.classList.add('controls-hidden');
        dock.setAttribute('aria-hidden', 'true');
        showButton.focus({ preventScroll: true });
      });
      showButton.addEventListener('click', () => {
        main.classList.remove('controls-hidden');
        dock.setAttribute('aria-hidden', 'false');
        hideButton.focus({ preventScroll: true });
      });

      function waitForReady() {
        return new Promise(resolve => {
          if (!play.disabled) return resolve();
          const timer = setInterval(() => {
            if (!play.disabled) { clearInterval(timer); resolve(); }
          }, 100);
        });
      }
      function chooseMimeType() {
        const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
        return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
      }
      exportButton.addEventListener('click', async () => {
        if (!window.MediaRecorder) {
          alert('Video export is not supported by this browser. Try the latest Chrome, Edge, or Firefox.');
          return;
        }
        if (exportButton.dataset.exporting === 'true') return;
        exportButton.dataset.exporting = 'true';
        exportButton.disabled = true;
        const previousLabel = exportButton.textContent;
        exportButton.textContent = 'Exporting…';
        try {
          await waitForReady();
          const source = viewport.querySelector('canvas');
          if (!source) throw new Error('Animation canvas is not ready.');
          const mimeType = chooseMimeType();
          const output = document.createElement('canvas');
          output.width = 1920;
          output.height = 1080;
          const context = output.getContext('2d');
          const stream = output.captureStream(60);
          const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
          const chunks = [];
          recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
          const stopped = new Promise((resolve, reject) => {
            recorder.addEventListener('stop', resolve, { once: true });
            recorder.addEventListener('error', reject, { once: true });
          });

          // Export must always begin from 0% progress (Outer / folded), then
          // reach 100% (Inner / unfolded), then return to 0% (Outer / folded).
          // Pause any current playback first, reset the animation phase to 0,
          // then start the deterministic 8.6-second cycle.
          if (play.getAttribute('aria-label') === 'Pause animation') play.click();
          window.__iphoneDuoAutoStart = true;
          angle.value = '0';
          angle.dispatchEvent(new Event('input', { bubbles: true }));
          recorder.start(100);
          if (play.getAttribute('aria-label') !== 'Pause animation') play.click();

          const start = performance.now();
          await new Promise(resolve => {
            const draw = now => {
              context.fillStyle = '#f6f6f3';
              context.fillRect(0, 0, 1920, 1080);
              const scale = Math.max(1920 / source.width, 1080 / source.height);
              const width = source.width * scale;
              const height = source.height * scale;
              context.drawImage(source, (1920 - width) / 2, (1080 - height) / 2, width, height);
              if (now - start < 8600) requestAnimationFrame(draw);
              else resolve();
            };
            requestAnimationFrame(draw);
          });
          if (play.getAttribute('aria-label') === 'Pause animation') play.click();
          recorder.stop();
          await stopped;

          const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `iphone-duo-animation-${new Date().toISOString().slice(0, 10)}-1080p.webm`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
          console.error('Video export failed', error);
          alert('Unable to export the animation video.');
        } finally {
          exportButton.dataset.exporting = 'false';
          exportButton.disabled = false;
          exportButton.textContent = previousLabel;
        }
      });
    })();
  </script>
</body>
</html>
