<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Duo · Fold Preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <div id="viewport" aria-label="iPhone Duo 3D model. Drag to rotate, scroll to zoom."></div>
    <a class="github-link" href="https://github.com/jadon7/iphone-duo" target="_blank" rel="noopener noreferrer" aria-label="View project on GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.853.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
    </a>
    <div class="control-dock">
      <aside class="screen-panel" aria-label="Screen UI">
        <div class="panel-heading"><h2>Screen UI</h2></div>
        <div class="ui-themes" role="tablist" aria-label="Screen UI type">
          <button role="tab" data-ui-theme="wallpaper" aria-selected="true" disabled>Wallpaper</button>
          <button role="tab" data-ui-theme="launcher" aria-selected="false" disabled>Launcher</button>
          <button role="tab" data-ui-theme="custom" aria-selected="false" disabled>Custom</button>
        </div>
        <div id="custom-upload-panel" class="custom-upload-panel" hidden>
          <button id="upload-single" type="button" class="upload-option">Single image<span>Use one image on both screens</span></button>
          <div class="separate-upload-group">
            <button id="upload-outer" type="button" class="upload-option">Outer screen<span>Upload outer image</span></button>
            <button id="upload-inner" type="button" class="upload-option">Inner screen<span>Upload inner image</span></button>
          </div>
          <p class="upload-hint"><strong>Recommended:</strong> inner <b>1600 × 1125 px</b> · outer <b>775 × 1125 px</b>. If only one screen image is uploaded, the other uses the Wallpaper screen.</p>
        </div>
        <input id="ui-upload-single" type="file" accept="image/*" hidden disabled>
        <input id="ui-upload-inner" type="file" accept="image/*" hidden disabled>
        <input id="ui-upload-outer" type="file" accept="image/*" hidden disabled>
        <button id="upload-separate" type="button" hidden tabindex="-1" aria-hidden="true">Separate</button>
      </aside>
      <section class="controls" aria-label="Fold animation controls">
        <button id="play" class="play" aria-label="Play animation" disabled><svg id="pause-icon" viewBox="0 0 24 24" hidden><path d="M8 6v12M16 6v12"/></svg><svg id="play-icon" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg></button>
        <input id="angle" aria-label="Fold progress" type="range" min="0" max="180" value="180" step="0.1" disabled>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const panel = document.querySelector('#custom-upload-panel');
      const customTab = document.querySelector('[data-ui-theme="custom"]');
      const singleInput = document.querySelector('#ui-upload-single');
      const innerInput = document.querySelector('#ui-upload-inner');
      const outerInput = document.querySelector('#ui-upload-outer');
      const singleButton = document.querySelector('#upload-single');
      const innerButton = document.querySelector('#upload-inner');
      const outerButton = document.querySelector('#upload-outer');
      let syntheticOuterChange = false;
      let defaultFiles = {};

      async function loadImage(src) {
        const image = new Image();
        image.src = src;
        await image.decode();
        return image;
      }
      async function makeWallpaperDefault(kind) {
        if (defaultFiles[kind]) return defaultFiles[kind];
        const [wallpaper, clock] = await Promise.all([
          loadImage('./assets/ui/wallpaper-inner.avif'),
          loadImage(`./assets/ui/clock-${kind}.avif`)
        ]);
        const canvas = document.createElement('canvas');
        canvas.width = kind === 'inner' ? 1600 : 775;
        canvas.height = 1125;
        const context = canvas.getContext('2d');
        if (kind === 'inner') {
          context.drawImage(wallpaper, 0, 0, 1600, 1125);
        } else {
          context.drawImage(wallpaper, wallpaper.width - wallpaper.width * 775 / 1600, 0, wallpaper.width * 775 / 1600, wallpaper.height, 0, 0, 775, 1125);
        }
        context.drawImage(clock, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        defaultFiles[kind] = new File([blob], `wallpaper-${kind}.png`, { type: 'image/png' });
        return defaultFiles[kind];
      }
      function setInputFile(input, file) {
        const transfer = new DataTransfer();
        transfer.items.add(file);
        input.files = transfer.files;
      }
      async function applyWithFallback(changedKind) {
        const fallbackKind = changedKind === 'inner' ? 'outer' : 'inner';
        const changedInput = changedKind === 'inner' ? innerInput : outerInput;
        const fallbackInput = fallbackKind === 'inner' ? innerInput : outerInput;
        if (!changedInput.files[0]) return;
        if (!fallbackInput.files[0]) setInputFile(fallbackInput, await makeWallpaperDefault(fallbackKind));
        syntheticOuterChange = true;
        outerInput.dispatchEvent(new Event('change', { bubbles: true }));
      }

      customTab.addEventListener('click', event => {
        event.stopImmediatePropagation();
        panel.hidden = false;
      }, true);
      singleButton.addEventListener('click', () => singleInput.click());
      outerButton.addEventListener('click', () => outerInput.click());
      innerButton.addEventListener('click', () => innerInput.click());

      innerInput.addEventListener('change', event => {
        event.stopImmediatePropagation();
        applyWithFallback('inner').catch(() => alert('Unable to prepare the default Wallpaper image.'));
      }, true);
      outerInput.addEventListener('change', event => {
        if (syntheticOuterChange) {
          syntheticOuterChange = false;
          return;
        }
        event.stopImmediatePropagation();
        applyWithFallback('outer').catch(() => alert('Unable to prepare the default Wallpaper image.'));
      }, true);
      document.querySelector('#upload-separate').addEventListener('click', event => event.stopImmediatePropagation(), true);
    })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
